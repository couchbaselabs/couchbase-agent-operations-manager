{{- if include "aom.couchbaseInitEnabled" . }}
# Runs init.sh (configmap-couchbase-init.yaml) to completion once per
# install/upgrade. Using Helm hooks (rather than a plain Job, which
# Helm would refuse to re-apply on `helm upgrade` since Jobs are
# immutable) with hook-delete-policy so a fresh Job replaces the
# previous one every time - safe because init.sh is fully idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aom.fullname" . }}-couchbase-init
  labels:
    {{- include "aom.componentLabels" (merge (dict "component" "couchbase-init") .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.couchbaseInit.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "aom.componentSelectorLabels" (merge (dict "component" "couchbase-init") .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: couchbase-init
          image: {{ include "aom.image" (dict "root" $ "repository" .Values.couchbase.image.repository "tag" .Values.couchbase.image.tag) }}
          imagePullPolicy: {{ .Values.couchbase.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_PROVISION_USERNAME
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_PROVISION_PASSWORD
            {{- if not .Values.couchbase.enabled }}
            # External mode (couchbase.enabled=false): init.sh skips cluster
            # init and quotas and provisions only inside the appliance's own
            # bucket on the server named here - see couchbase.external in
            # values.yaml and the header of couchbase-init/init.sh.
            - name: COUCHBASE_EXTERNAL
              value: "true"
            - name: COUCHBASE_EXTERNAL_KIND
              value: {{ .Values.couchbase.external.kind | quote }}
            - name: COUCHBASE_HOST
              value: {{ include "aom.couchbaseExternalHost" . | quote }}
            - name: COUCHBASE_TLS
              value: {{ .Values.couchbase.external.tls | quote }}
            {{- if .Values.couchbase.external.tlsCaCert }}
            - name: COUCHBASE_TLS_CA_FILE
              value: /etc/couchbase-ca/ca.pem
            {{- end }}
            {{- if .Values.couchbase.external.tlsInsecure }}
            - name: COUCHBASE_TLS_VERIFY
              value: "false"
            {{- end }}
            - name: COUCHBASE_INIT_VERSION
              value: {{ printf "%s-%s" .Chart.Version .Chart.AppVersion | quote }}
            {{- end }}
            - name: COUCHBASE_BUCKET
              value: {{ .Values.operationsManager.couchbase.bucket | quote }}
            - name: COUCHBASE_SCOPE
              value: {{ .Values.operationsManager.couchbase.scope | quote }}
            # RAM quotas (MB) - re-asserted on every install/upgrade by
            # init.sh. See couchbase.ramQuotaMB in values.yaml.
            - name: COUCHBASE_CLUSTER_RAMSIZE
              value: {{ .Values.couchbase.ramQuotaMB.data | quote }}
            - name: COUCHBASE_INDEX_RAMSIZE
              value: {{ .Values.couchbase.ramQuotaMB.index | quote }}
            - name: COUCHBASE_FTS_RAMSIZE
              value: {{ .Values.couchbase.ramQuotaMB.fts | quote }}
            - name: COUCHBASE_BUCKET_RAMSIZE
              value: {{ .Values.couchbase.ramQuotaMB.bucket | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: init-script
              mountPath: /scripts
              readOnly: true
            {{- if and (not .Values.couchbase.enabled) .Values.couchbase.external.tlsCaCert }}
            - name: couchbase-ca
              mountPath: /etc/couchbase-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: init-script
          configMap:
            name: {{ include "aom.fullname" . }}-couchbase-init
            defaultMode: 0555
        {{- if and (not .Values.couchbase.enabled) .Values.couchbase.external.tlsCaCert }}
        - name: couchbase-ca
          configMap:
            name: {{ include "aom.couchbaseCaConfigMapName" . }}
        {{- end }}
{{- end }}
