apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aom.fullname" . }}-operations-manager
  labels:
    {{- include "aom.componentLabels" (merge (dict "component" "operations-manager") .) | nindent 4 }}
spec:
  replicas: {{ .Values.operationsManager.replicaCount }}
  # Recreate, not RollingUpdate: the embedding-model cache is a
  # ReadWriteOnce volume (a surge pod scheduled onto another node could
  # never mount it and the rollout would hang), and the background sweepers
  # and monitors assume a single running instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aom.componentSelectorLabels" (merge (dict "component" "operations-manager") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aom.componentSelectorLabels" (merge (dict "component" "operations-manager") .) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Kubernetes has no direct equivalent of docker-compose.yml's
      # depends_on: condition: service_healthy /
      # service_completed_successfully - a Deployment will happily start
      # this container the moment its Pod is scheduled, which is exactly
      # the race (ScopeNotFoundException before the scope exists) that
      # forced those conditions in the first place. This initContainer
      # polls the same readiness signals directly (cluster up ->
      # authenticated -> scope actually created; then sample-mcp-servers'
      # own health endpoint) using the operations-manager image itself
      # (already has curl, for its own HEALTHCHECK) rather than adding a
      # Kubernetes-API-polling sidecar with its own RBAC.
      initContainers:
        - name: wait-for-dependencies
          image: {{ include "aom.image" (dict "root" $ "repository" .Values.operationsManager.image.repository "tag" .Values.operationsManager.image.tag) }}
          imagePullPolicy: {{ .Values.operationsManager.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # aom.couchbaseSearchHost resolves to the bundled couchbase
              # Service when couchbase.enabled is true, or to
              # operationsManager.couchbase.searchHost (your external
              # server) when it's false - either way, this still waits for
              # the bucket/scope this appliance needs to actually exist
              # before starting, not just for the process to be up.
              echo "Waiting for Couchbase web console..."
              until curl -s -o /dev/null "http://{{ include "aom.couchbaseSearchHost" . }}:8091/pools"; do sleep 2; done
              echo "Waiting for Couchbase to accept authenticated requests..."
              until curl -s -o /dev/null -u "$COUCHBASE_USERNAME:$COUCHBASE_PASSWORD" "http://{{ include "aom.couchbaseSearchHost" . }}:8091/pools/default"; do sleep 2; done
              echo "Waiting for scope '$COUCHBASE_SCOPE' to be provisioned..."
              until curl -s -u "$COUCHBASE_USERNAME:$COUCHBASE_PASSWORD" "http://{{ include "aom.couchbaseSearchHost" . }}:8091/pools/default/buckets/$COUCHBASE_BUCKET/scopes" | grep -q "\"name\":\"$COUCHBASE_SCOPE\""; do sleep 3; done
              {{- if .Values.sampleMcpServers.enabled }}
              echo "Waiting for sample-mcp-servers..."
              until curl -s -o /dev/null "http://{{ include "aom.sampleMcpServersServiceName" . }}:8100/healthz"; do sleep 2; done
              {{- end }}
              echo "Dependencies ready."
          env:
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_USERNAME
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_PASSWORD
            - name: COUCHBASE_BUCKET
              value: {{ .Values.operationsManager.couchbase.bucket | quote }}
            - name: COUCHBASE_SCOPE
              value: {{ .Values.operationsManager.couchbase.scope | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: operations-manager
          image: {{ include "aom.image" (dict "root" $ "repository" .Values.operationsManager.image.repository "tag" .Values.operationsManager.image.tag) }}
          imagePullPolicy: {{ .Values.operationsManager.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8090"
            - name: APPLIANCE_NAME
              value: {{ .Values.operationsManager.applianceName | quote }}
            - name: COUCHBASE_CONNECTION_STRING
              value: {{ include "aom.couchbaseConnectionString" . | quote }}
            - name: COUCHBASE_SEARCH_HOST
              value: {{ include "aom.couchbaseSearchHost" . | quote }}
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_USERNAME
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COUCHBASE_PASSWORD
            - name: COUCHBASE_BUCKET
              value: {{ .Values.operationsManager.couchbase.bucket | quote }}
            - name: COUCHBASE_SCOPE
              value: {{ .Values.operationsManager.couchbase.scope | quote }}
            {{- if .Values.sampleMcpServers.enabled }}
            - name: SAMPLE_MCP_SERVERS_BASE_URL
              value: "http://{{ include "aom.sampleMcpServersServiceName" . }}:8100"
            {{- end }}
            - name: API_KEY_SUPPORT_AGENT
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: API_KEY_SUPPORT_AGENT
            - name: API_KEY_FINANCE_ANALYST
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: API_KEY_FINANCE_ANALYST
            - name: API_KEY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: API_KEY_ADMIN
            - name: AUDIT_LOG_RETENTION_HOURS
              value: {{ .Values.operationsManager.audit.logRetentionHours | quote }}
            - name: HIJACK_SCAN_INTERVAL_MINUTES
              value: {{ .Values.operationsManager.hijackDetection.scanIntervalMinutes | quote }}
            - name: HIJACK_CHAIN_WINDOW_SECONDS
              value: {{ .Values.operationsManager.hijackDetection.chainWindowSeconds | quote }}
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: AUTH_SECRET_KEY
            - name: AUTH_SESSION_TTL_HOURS
              value: {{ .Values.operationsManager.auth.sessionTtlHours | quote }}
            - name: DEFAULT_ADMIN_USERNAME
              value: {{ .Values.operationsManager.auth.defaultAdminUsername | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.operationsManager.cors.allowedOrigins | quote }}
            - name: DISABLE_TLS
              value: {{ .Values.operationsManager.tls.disabled | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: GEMINI_API_KEY
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: VOYAGE_API_KEY
                  optional: true
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: COHERE_API_KEY
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: MISTRAL_API_KEY
                  optional: true
            - name: JINA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: JINA_API_KEY
                  optional: true
            - name: EMBEDDING_MAX_LOADED_MODELS
              value: {{ .Values.operationsManager.embeddingMaxLoadedModels | default 2 | quote }}
            - name: DATABRICKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aom.authSecretName" . }}
                  key: DATABRICKS_TOKEN
                  optional: true
            - name: DATABRICKS_HOST
              value: {{ (.Values.operationsManager.databricks | default dict).host | default "" | quote }}
            - name: DATABRICKS_SERVING_ENDPOINTS
              value: {{ (.Values.operationsManager.databricks | default dict).servingEndpoints | default "" | quote }}
            - name: LLM_CACHE_ENABLED
              value: {{ .Values.operationsManager.llmCache.enabled | quote }}
            - name: LLM_CACHE_PROVIDER
              value: {{ .Values.operationsManager.llmCache.provider | quote }}
            - name: LLM_CACHE_MODEL
              value: {{ .Values.operationsManager.llmCache.model | quote }}
            - name: LLM_CACHE_TTL_SECONDS
              value: {{ .Values.operationsManager.llmCache.ttlSeconds | quote }}
            - name: LLM_CACHE_MAX_ENTRIES
              value: {{ .Values.operationsManager.llmCache.maxEntries | quote }}
            - name: LLM_CACHE_SEMANTIC_ENABLED
              value: {{ .Values.operationsManager.llmCache.semanticEnabled | quote }}
            - name: LLM_CACHE_SIMILARITY_THRESHOLD
              value: {{ .Values.operationsManager.llmCache.similarityThreshold | quote }}
            - name: LLM_CACHE_LOG_RETENTION_HOURS
              value: {{ .Values.operationsManager.llmCache.logRetentionHours | quote }}
            - name: LOG_LEVEL
              value: INFO
            {{- with .Values.operationsManager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: hf-cache
              mountPath: /home/appuser/.cache/huggingface
            - name: tls
              mountPath: /app/tls
              readOnly: true
          # First start downloads the embedding model before the API
          # answers anything, which can take minutes on a slow link; the
          # startup probe gives it up to 10 minutes without making the
          # liveness probe slow to notice a hung process afterwards.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: {{ .Values.operationsManager.tls.disabled | ternary "HTTP" "HTTPS" }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: {{ .Values.operationsManager.tls.disabled | ternary "HTTP" "HTTPS" }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: {{ .Values.operationsManager.tls.disabled | ternary "HTTP" "HTTPS" }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.operationsManager.resources | nindent 12 }}
      volumes:
        - name: hf-cache
          {{- if .Values.operationsManager.hfCache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aom.fullname" . }}-hf-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tls
          secret:
            secretName: {{ include "aom.tlsSecretName" . }}
            defaultMode: 0644
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
