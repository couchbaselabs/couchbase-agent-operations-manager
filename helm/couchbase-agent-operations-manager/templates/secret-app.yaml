{{- $secretName := include "aom.authSecretName" . -}}
{{- /*
  lookup can return nil (nothing found), or a map missing "data"
  entirely (e.g. a Secret with no stringData/data keys yet). `default
  dict` + sprig's `get` (which never errors on a missing key, unlike
  `index`) keep this safe in both cases - do not swap `get` back for
  `index $existing.data ...` without re-testing against a real
  `helm install` (not just `--dry-run`/`helm template`, where `lookup`
  never runs for real and this whole branch is untested).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict -}}
{{- $existingData := get $existing "data" | default dict -}}
{{- $authKey := .Values.operationsManager.auth.secretKey -}}
{{- if not $authKey -}}
  {{- $existingAuthKey := get $existingData "AUTH_SECRET_KEY" -}}
  {{- if $existingAuthKey -}}
    {{- $authKey = $existingAuthKey | b64dec -}}
  {{- else -}}
    {{- $authKey = randAlphaNum 64 -}}
  {{- end -}}
{{- end -}}
{{- /*
  Same generate-once-then-keep pattern for the credentials that used to
  default to published demo values: the bundled Couchbase admin password
  and the three seeded agent API keys. An explicit value always wins;
  otherwise an existing install keeps what it already has (so an upgrade
  never rotates them under you), and a fresh install gets random values
  instead of strings anyone can read in this public repository.
*/ -}}
{{- if and (not .Values.couchbase.enabled) (not .Values.operationsManager.couchbase.password) -}}
  {{- fail "couchbase.enabled is false: set operationsManager.couchbase.username/password to your external Couchbase server's credentials" -}}
{{- end -}}
{{- $generated := dict -}}
{{- range $key, $spec := dict
      "COUCHBASE_PASSWORD" (list .Values.operationsManager.couchbase.password 32)
      "API_KEY_SUPPORT_AGENT" (list .Values.operationsManager.apiKeys.supportAgent 40)
      "API_KEY_FINANCE_ANALYST" (list .Values.operationsManager.apiKeys.financeAnalyst 40)
      "API_KEY_ADMIN" (list .Values.operationsManager.apiKeys.admin 40) -}}
  {{- $value := index $spec 0 -}}
  {{- if not $value -}}
    {{- $existingValue := get $existingData $key -}}
    {{- if $existingValue -}}
      {{- $value = $existingValue | b64dec -}}
    {{- else -}}
      {{- $value = randAlphaNum (index $spec 1) -}}
    {{- end -}}
  {{- end -}}
  {{- $_ := set $generated $key $value -}}
{{- end -}}
# Signs dashboard session cookies + encrypts the LDAP bind password at
# rest (AUTH_SECRET_KEY - see operations-manager/app/user_auth.py).
# Auto-generated once and read back on every subsequent `helm upgrade`
# (via the `lookup` above) so it never rotates under you - rotating it
# logs everyone out and makes any stored LDAP bind password unreadable.
# `helm template` / `helm install --dry-run` can't use `lookup` (no live
# cluster to query), so those always take the "generate a fresh one"
# branch - that's expected, not a bug; the real `helm install` still
# only generates once.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "aom.labels" . | nindent 4 }}
type: Opaque
stringData:
  COUCHBASE_USERNAME: {{ .Values.operationsManager.couchbase.username | quote }}
  COUCHBASE_PASSWORD: {{ get $generated "COUCHBASE_PASSWORD" | quote }}
  {{- /*
    What the couchbase-init Job authenticates as. Bundled: the admin above.
    External: couchbase.external.provision.username/password when set (an
    admin that may create the bucket on enterprise), else the same
    credentials operations-manager runs with.
  */}}
  COUCHBASE_PROVISION_USERNAME: {{ .Values.couchbase.external.provision.username | default .Values.operationsManager.couchbase.username | quote }}
  COUCHBASE_PROVISION_PASSWORD: {{ .Values.couchbase.external.provision.password | default (get $generated "COUCHBASE_PASSWORD") | quote }}
  AUTH_SECRET_KEY: {{ $authKey | quote }}
  API_KEY_SUPPORT_AGENT: {{ get $generated "API_KEY_SUPPORT_AGENT" | quote }}
  API_KEY_FINANCE_ANALYST: {{ get $generated "API_KEY_FINANCE_ANALYST" | quote }}
  API_KEY_ADMIN: {{ get $generated "API_KEY_ADMIN" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.operationsManager.providerApiKeys.anthropic | quote }}
  OPENAI_API_KEY: {{ .Values.operationsManager.providerApiKeys.openai | quote }}
  GEMINI_API_KEY: {{ .Values.operationsManager.providerApiKeys.gemini | quote }}
  VOYAGE_API_KEY: {{ .Values.operationsManager.providerApiKeys.voyage | default "" | quote }}
  COHERE_API_KEY: {{ .Values.operationsManager.providerApiKeys.cohere | default "" | quote }}
  MISTRAL_API_KEY: {{ .Values.operationsManager.providerApiKeys.mistral | default "" | quote }}
  JINA_API_KEY: {{ .Values.operationsManager.providerApiKeys.jina | default "" | quote }}
  DATABRICKS_TOKEN: {{ .Values.operationsManager.providerApiKeys.databricks | default "" | quote }}
  METRICS_TOKEN: {{ .Values.metrics.token | default "" | quote }}
