{{- if .Values.couchbase.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aom.fullname" . }}-couchbase
  labels:
    {{- include "aom.componentLabels" (merge (dict "component" "couchbase") .) | nindent 4 }}
spec:
  serviceName: {{ include "aom.couchbaseServiceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aom.componentSelectorLabels" (merge (dict "component" "couchbase") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aom.componentSelectorLabels" (merge (dict "component" "couchbase") .) | nindent 8 }}
    spec:
      # Couchbase Server's own entrypoint needs root inside the container
      # (matches the upstream image's own default - docker-compose.yml
      # doesn't drop capabilities on this service either, for the same
      # reason), so no restrictive pod-level securityContext here.
      containers:
        - name: couchbase
          image: {{ include "aom.image" (dict "root" $ "repository" .Values.couchbase.image.repository "tag" .Values.couchbase.image.tag) }}
          imagePullPolicy: {{ .Values.couchbase.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: admin
              containerPort: 8091
            - name: port8092
              containerPort: 8092
            - name: query
              containerPort: 8093
            - name: search
              containerPort: 8094
            - name: analytics
              containerPort: 8095
            - name: eventing
              containerPort: 8096
            - name: data
              containerPort: 11210
          volumeMounts:
            - name: data
              mountPath: /opt/couchbase/var
          # No `-f`: this Couchbase Server version returns 401 on the
          # unauthenticated /pools endpoint, which curl -f (and an
          # httpGet probe, which only accepts 2xx-3xx) would treat as a
          # hard failure even though the server is perfectly healthy -
          # same reasoning as docker-compose.yml's healthcheck, hence an
          # exec probe here instead of httpGet.
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null http://localhost:8091/pools"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null http://localhost:8091/pools"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.couchbase.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.couchbase.persistence.storageClassName }}
        storageClassName: {{ .Values.couchbase.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.couchbase.persistence.size }}
{{- end }}
