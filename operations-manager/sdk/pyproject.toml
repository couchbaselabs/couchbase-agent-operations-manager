[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couchbase-aom-sdk"
version = "0.8.0"
description = "Official Python client SDK for the Couchbase Agent Operations Manager"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# Only needed for aom_sdk.mcp_server, the bridge that exposes this
# appliance as a real MCP server. Everything else in the SDK depends on
# nothing but `requests`.
# aom_sdk.mcp_server uses the low-level Server's @list_tools()/@call_tool()
# decorators, which mcp 2.0 removed, so stay on 1.x until it's ported
# (sample-mcp-servers/ and operations-manager/ already pin 1.30.0).
mcp = ["mcp>=1.2.0,<2"]

[project.scripts]
aom-mcp-server = "aom_sdk.mcp_server:main"

[tool.setuptools.packages.find]
include = ["aom_sdk*"]
